name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: sh
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache git go build-base
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Checkout
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          git clone --depth 1 "https://oauth2:${REPO_TOKEN}@git.zipse.cloud/${GITHUB_REPOSITORY}.git" .
          git checkout $GITHUB_SHA

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Lint
        run: golangci-lint run

      - name: Unit tests
        run: go test -v -count=1 -race -shuffle=on ./...

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Tag release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          git config user.name "cta-sdk-bot"
          git config user.email "bot@zipse.cloud"

          latest=$(git tag --list 'v*' --sort=-version:refname | head -1)
          if [ -z "$latest" ]; then
            new_tag="v0.1.0"
          else
            base=${latest#v}
            major=${base%%.*}
            rest=${base#*.}
            minor=${rest%%.*}
            patch=${rest#*.}
            if [ "$patch" = "$rest" ]; then patch=0; fi
            new_tag="v${major}.${minor}.$((patch + 1))"
          fi

          git tag "$new_tag"
          git push "https://oauth2:${REPO_TOKEN}@git.zipse.cloud/${GITHUB_REPOSITORY}.git" "$new_tag"
