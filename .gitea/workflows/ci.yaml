name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Install OS dependencies
        run: |
          apt update 
          apt install -y -qq git golangci-lint build-essential

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Go dependencies
        run: go mod download

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Lint
        run: golangci-lint run

      - name: Unit tests
        run: go test -v -count=1 -race -shuffle=on ./...

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Tag release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "cta-sdk-bot"
          git config user.email "bot@zipse.cloud"

          latest=$(git tag --list 'v*' --sort=-version:refname | head -1)
          if [ -z "$latest" ]; then
            new_tag="v0.1.0"
          else
            base=${latest#v}
            major=${base%%.*}
            rest=${base#*.}
            minor=${rest%%.*}
            patch=${rest#*.}
            if [ "$patch" = "$rest" ]; then patch=0; fi
            new_tag="v${major}.${minor}.$((patch + 1))"
          fi

          git tag "$new_tag"
          git push "https://oauth2:${{ gitea.token }}@git.zipse.cloud/zippy/cta-go-sdk.git" "$new_tag"
