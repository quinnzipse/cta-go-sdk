run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

output:
  formats: 
    - colored-line-number
  print-issued-lines: true
  print-linter-name: true

issues:
  exclude-use-default: false
  max-same-issues: 3
  exclude-dirs:
    - vendor
    - third_party
  # Avoid noisy style warnings for generated code
  exclude:
    - "generated"
  fix: false

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment # too opinionated, sometimes noisy
  staticcheck:
    checks: ["all"]
  stylecheck:
    checks: ["all"]
  revive:
    enable-all-rules: true
    severity: warning
    confidence: 0.8
    rules:
      - name: var-naming
      - name: indent-error-flow
      - name: unexported-return
      - name: exported
  gofumpt:
    extra-rules: true
  gocyclo:
    min-complexity: 10
  funlen:
    lines: 60
    statements: 40
  goconst:
    min-len: 2
    min-occurrences: 3
  depguard:
    list-type: blacklist
    packages:
      - github.com/pkg/errors
    include-go-root: false
    message: "Use the standard 'errors' package instead of pkg/errors"
  dupl:
    threshold: 100
  misspell:
    locale: US
  errcheck:
    check-type-assertions: true
    check-blank: true
  nakedret:
    max-func-lines: 30
  goimports:
    local-prefixes: your_project_name

linters:
  enable-all: true
  disable:
    - tenv
